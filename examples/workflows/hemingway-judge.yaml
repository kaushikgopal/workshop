description: Like hemingway-clock, but the timestamp check rejects attempt 1 so the failure judge decides a retry.
schedule:
  every: 10m
  max_runs: 1
defaults:
  max_attempts: 2
  timeout: 10m
  replay: safe
environment:
  preflight:
    command: 'command -v pi >/dev/null'
steps:
  - timestamp:
      run: date -u +%FT%TZ
      # Deterministic first-attempt rejection: attempt 1 fails, attempt 2 passes.
      check: |
        if [ "$WORKSHOP_ATTEMPT" -lt 2 ]; then
          echo "transient smoke gate: attempt $WORKSHOP_ATTEMPT is always rejected; the step is replay-safe and a retry will pass" >&2
          exit 1
        fi
  - generate-line:
      agent: |
        Generate one original Hemingway-inspired sentence, not a quotation.
        Read the earlier quote files in the directory named by $WORKSHOP_ARCHIVE
        before generating. Avoid repeating their scenes, images, or wording.
        Write the required result JSON to the supplied result path.
        Put only the sentence in output; explain your checks in summary.
        Do not edit archived quotes or Workshop state.
      check: |
        Independently compare the candidate with the quote files in the
        directory named by $WORKSHOP_ARCHIVE. Pass only if it is one original
        sentence, does not claim Hemingway authorship, and is materially
        distinct in scene, image, and wording.
        Write the required passed/reason JSON to your supplied result path.
  - publish-quote:
      run: cp "$WORKSHOP_PREVIOUS_OUTPUT_FILE" "$WORKSHOP_ARCHIVE/$WORKSHOP_RUN_ID.md"
      max_attempts: 1

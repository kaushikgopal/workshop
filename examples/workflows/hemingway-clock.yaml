version: 4
description: Generate an original sentence, verify it, and archive one quote file per run.
schedule:
  every: 10m
  max_runs: 6
defaults:
  retries: 1
  timeout: 10m
  replay: safe
environment:
  preflight:
    command: 'command -v pi >/dev/null'
steps:
  - timestamp: date -u +%FT%TZ
  - generate-line:
      agent: |
        Generate one original Hemingway-inspired sentence, not a quotation.
        Read the earlier quote files in the directory named by $WORKSHOP_ARCHIVE.
        Avoid repeating their scenes, images, or wording.
        Emit the tagged worker result on stdout with status succeeded.
        Put only the sentence in output. Put any explanation in reason.
        Do not edit archived quotes or Workshop files.
      verify:
        agent: |
          Independently compare the candidate with the quote files in the
          directory named by $WORKSHOP_ARCHIVE. Accept only one original
          sentence that does not claim Hemingway authorship and is materially
          distinct in scene, image, and wording.
          Emit the tagged verifier decision and reason on stdout.
          Do not edit archived quotes or Workshop files.
  - publish-quote:
      run: cat > "$WORKSHOP_ARCHIVE/$WORKSHOP_RUN_ID.md"
      retries: 0
      replay: never

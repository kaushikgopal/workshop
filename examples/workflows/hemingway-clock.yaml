version: 2
id: hemingway-clock
description: Generate an original sentence, validate it, and publish one quote file per run.
schedule:
  every: 10m
  max_runs: 6
defaults:
  max_attempts: 2
  timeout: 10m
  replay: never
  agent:
    harness:
      command: 'pi --print --approve --no-session --model "$WORKSHOP_MODEL_WITH_THINKING" -- "$(cat "$WORKSHOP_PROMPT_FILE")"'
environment:
  preflight:
    command: 'command -v pi >/dev/null'
nodes:
  node-timestamp:
    run:
      command: 'date -u +%FT%TZ'
    replay: safe
    validator:
      command: 'test -s "$WORKSHOP_NODE_OUTPUT_FILE"'
      replay: safe
    next: node-generate-line
  node-generate-line:
    run:
      agent:
        instructions: |
          Generate one original Hemingway-inspired sentence, not a quotation.
          Read the previously published quote files in the run archive before
          generating. Avoid repeating their scenes, images, or wording.
          Write the required result JSON to the supplied result path.
          Put only the sentence in output; explain your checks in summary.
          Do not edit archived quotes or runtime-owned state.
    replay: safe
    validator:
      agent:
        instructions: |
          Independently compare the candidate with archived quote files.
          Pass only if it is one original sentence, does not claim Hemingway
          authorship, and is materially distinct in scene, image, and wording.
          Write the required passed/reason JSON to your supplied result path.
      replay: safe
    next: node-publish-quote
  node-publish-quote:
    run:
      command: |
        directory=".workshop/state/quotes"
        mkdir -p "$directory"
        target="$directory/$WORKSHOP_RUN_ID.md"
        if [ -f "$target" ]; then
          cmp -s "$target" "$WORKSHOP_PREVIOUS_OUTPUT_FILE" || exit 1
        else
          temporary="$target.tmp.$WORKSHOP_EXECUTION_ID"
          cp "$WORKSHOP_PREVIOUS_OUTPUT_FILE" "$temporary"
          mv "$temporary" "$target"
        fi
        printf '%s\n' "$target"
    replay: safe
    max_attempts: 1
    next: null

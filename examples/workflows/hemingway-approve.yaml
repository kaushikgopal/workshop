version: 4
description: Draft a sentence and pause for explicit human approval.
defaults:
  retries: 1
  timeout: 10m
  replay: safe
environment:
  preflight:
    command: 'command -v pi >/dev/null'
steps:
  - draft:
      agent: |
        Draft one original Hemingway-inspired sentence, not a quotation.
        Request human approval (needs_input) with the question: Approve this sentence?
        Put only the draft sentence in output.

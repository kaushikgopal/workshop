# Machine defaults for a new v4 installation. Copy to .workshop/config/workshop.yaml.
# The harness and models are placeholders: replace the models with ones your
# Pi installation can use, and confirm the pi flags against your installed CLI.
version: 2
shell: /bin/bash
max_concurrent_runs: 1
default_timeout: 10m
stream_cap: 256kb
agent:
  harness:
    command: 'pi --print --approve --no-session --model "$WORKSHOP_MODEL_WITH_THINKING" -- "$(cat "$WORKSHOP_PROMPT_FILE")"'
  model: "example/pi-model:medium"
orchestrator:
  model: "example/judge-model:low"
  timeout: 5m

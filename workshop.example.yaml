agent_profiles:
  writer:
    command: [pi, -p, --no-session, --model, "<provider>/<model>"]
  claude:
    command: [claude, -p, --model, "<model>"]
  codex:
    command: [codex, exec, "-"]
# Optional Pi model patterns use Pi's model registry and auth store.
# Omit either field to use Pi's configured default model.
orchestrator: {}

# To override defaults, replace {} above with:
#   model: <provider>/<model>
#   escalation_model: <provider>/<model>
